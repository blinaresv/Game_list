<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GameVault — Biblioteca de Videojuegos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">

  <header class="header">
    <h1>🎮 GameVault</h1>
    <p>Organiza tus juegos por estado y categoría</p>
  </header>

  <!-- FORMULARIO -->
  <section class="box">
    <h2 id="form-title">Agregar videojuego</h2>

    <form id="game-form">
      <input type="hidden" id="game-id" />

      <div class="grid">
        <div>
          <label>Título *</label>
          <input type="text" id="titulo" required />
        </div>

        <div>
          <label>Año *</label>
          <input type="number" id="anio" required min="1970" max="2030" />
        </div>

        <div>
          <label>Categoría</label>
          <select id="categoriaId"></select>
        </div>

        <div>
          <label>Estado</label>
          <select id="estado">
            <option value="PENDIENTE">Pendiente</option>
            <option value="JUGANDO">Jugando</option>
            <option value="TERMINADO">Terminado</option>
            <option value="FAVORITO">Favorito</option>
          </select>
        </div>

        <div class="full">
          <label>URL de imagen de portada</label>
          <input type="url" id="imagenUrl" placeholder="https://..." />
        </div>

        <div class="full">
          <label>Descripción</label>
          <textarea id="descripcion" rows="2" placeholder="Descripción breve del juego..."></textarea>
        </div>
      </div>

      <div class="buttons">
        <button class="btn">Guardar</button>
        <button type="button" class="btn btn-gray" id="cancel-btn">Cancelar</button>
      </div>
    </form>

    <p id="message"></p>
  </section>

  <!-- BIBLIOTECA VISUAL -->
  <section class="box">
    <div class="top-row">
      <h2>Mi biblioteca</h2>

      <div class="tools">
        <input type="text" id="search-input" placeholder="Buscar..." />
        <select id="filter-category"></select>
        <button class="btn btn-gray" id="reload-btn">Recargar</button>
      </div>
    </div>

    <div id="games-list" class="games-list"></div>
  </section>

  <!-- DETALLE -->
  <section class="box">
    <h2>Detalle</h2>
    <div id="game-detail" class="detail-box"></div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
