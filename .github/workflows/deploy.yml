name: 🚀 Deploy a GCP Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build y Deploy en GCP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Autenticar con GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ⚙️ Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: 🐳 Configurar Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: 🏗️ Ejecutar Cloud Build
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions=COMMIT_SHA=${{ github.sha }},REPO_NAME=${{ github.event.repository.name }}

      - name: 💬 Comentar URL del deploy
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.sha.substring(0, 7);
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `## 🚀 Deploy exitoso\n\n**Commit:** \`${sha}\`\n**URL:** https://game-list-app-${{ secrets.GCP_REGION }}.a.run.app\n**Swagger:** https://game-list-app-${{ secrets.GCP_REGION }}.a.run.app/swagger-ui.html`
            });
